<div class="player-bar" [class.hidden]="!track()">
  <div class="track-info">
    @if (track(); as t) {
      <span class="title">{{ t.title || t.filename }}</span>
      <span class="artist">{{ t.artist || "—" }}</span>
    }
  </div>

  <p-button
    [icon]="playing() ? 'pi pi-pause' : 'pi pi-play'"
    [rounded]="true"
    [disabled]="loading() || !track()"
    (onClick)="togglePlay()"
  />

  <span class="time">{{ formatTime(currentTime()) }}</span>

  <div class="waveform-wrap">
    <div #waveform class="waveform"></div>
    <input
      type="range"
      class="seek-bar"
      [min]="0"
      [max]="duration()"
      [value]="currentTime()"
      step="0.1"
      (input)="onSeekChange($event)"
      (change)="onSeekEnd($event)"
      (mousedown)="onSeekStart()"
      (touchstart)="onSeekStart()"
    />
    @if (loading()) {
      <span class="status">Cargando…</span>
    }
    @if (error(); as err) {
      <span class="status error">{{ err }}</span>
      <p-button
        icon="pi pi-external-link"
        [label]="externalLabel()"
        [text]="true"
        severity="secondary"
        (onClick)="openExternal()"
      />
    }
  </div>

  <span class="time">{{ formatTime(duration()) }}</span>

  <div class="volume">
    <i class="pi pi-volume-up"></i>
    <p-slider
      [(ngModel)]="volume"
      [min]="0"
      [max]="100"
      (onChange)="onVolumeChange(volume)"
      styleClass="volume-slider"
    />
  </div>
</div>
